name: Verify

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5

      - name: Build
        run: mise run build

      - name: Test and check coverage
        run: mise run test:cover

      - name: Lint
        run: mise run lint